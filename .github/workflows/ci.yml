name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: torres_motors_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d torres_motors_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/torres_motors_db
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m src.etl.extract_transform --start-date 2026-01-01 --end-date 2026-01-07
      - run: psql -h localhost -U postgres -d torres_motors_db -f database/schema.sql
      - run: python -m src.etl.load_to_db
      - run: psql -h localhost -U postgres -d torres_motors_db -f database/queries_validation.sql
